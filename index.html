<html lang="vi">
<head>
   <meta charset="UTF-8">
 star<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌕 Chúc Mừng Trung Thu 25/9 🌕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #0b1026 0%, #1a1f4a 50%, #2b1b4d 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    position: relative;
    color: #fff;
    cursor: pointer;
  }

  /* ===== SAO TRỜI NHẤP NHÁY ===== */
  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.8); }
    to   { opacity: 1;   transform: scale(1.2); }
  }

  /* ===== CHỮ BAY BỔNG NHƯ SAO ===== */
  .flying-text {
    position: fixed;
    white-space: nowrap;
    font-weight: 900;
    pointer-events: none;
    z-index: 3;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd75e, #fff8c4, #ffd75e, #ff9e3d, #ffd75e);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 12px rgba(255,220,120,1))
            drop-shadow(0 0 25px rgba(255,180,60,0.7));
    animation: shine 3s linear infinite;
  }
  @keyframes shine {
    to { background-position: 300% center; }
  }

  @keyframes flyLeftToRight {
    from { transform: translateX(-40vw); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    to   { transform: translateX(120vw); opacity: 0; }
  }

  @keyframes flyRightToLeft {
    from { transform: translateX(120vw); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    to   { transform: translateX(-40vw); opacity: 0; }
  }

  /* ===== CHỮ TỎA RA KHI BẤM ===== */
  .burst-text {
    position: fixed;
    white-space: nowrap;
    font-weight: 900;
    pointer-events: none;
    z-index: 100;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd75e, #fff, #ff9e3d, #ffd75e);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 15px rgba(255,220,120,1))
            drop-shadow(0 0 30px rgba(255,150,50,0.8));
    animation: burstFly 2.5s ease-out forwards;
  }
  @keyframes burstFly {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20% { opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));
      opacity: 0;
    }
  }

  /* ===== SAO BĂNG ===== */
  .shooting-star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px 2px #fff, 0 0 20px 4px rgba(255,255,200,0.6);
    pointer-events: none;
    z-index: 1;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 0;
    width: 120px;
    height: 2px;
    background: linear-gradient(-90deg, #fff, transparent);
    transform: translateY(-50%);
  }
  @keyframes shoot {
    0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(-600px, 420px) rotate(-35deg); opacity: 0; }
  }

  /* ===== MẶT TRĂNG ===== */
  .moon {
    position: fixed;
    top: 6%;
    right: 10%;
    width: 130px;
    height: 130px;
    background: radial-gradient(circle at 35% 35%, #fffbe0, #ffe98a 60%, #f4c542);
    border-radius: 50%;
    box-shadow: 0 0 60px 20px rgba(255, 230, 130, 0.6),
                0 0 120px 40px rgba(255, 220, 100, 0.3);
    animation: moonGlow 4s ease-in-out infinite alternate;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes moonGlow {
    from { box-shadow: 0 0 50px 15px rgba(255,230,130,0.5), 0 0 100px 30px rgba(255,220,100,0.25); }
    to   { box-shadow: 0 0 80px 25px rgba(255,240,160,0.8), 0 0 150px 50px rgba(255,220,100,0.4); }
  }

  /* ===== ĐÈN LỒNG BAY ===== */
  .lantern {
    position: fixed;
    font-size: 2.2rem;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 10px rgba(255,120,50,0.8));
    z-index: 2;
    pointer-events: none;
  }
  @keyframes floatUp {
    from { transform: translateY(110vh) rotate(-5deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    to   { transform: translateY(-20vh) rotate(5deg); opacity: 0; }
  }

  /* ===== CHỮ CHÍNH GIỮA ===== */
  .center-title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
    width: 90%;
  }

  .main-title {
    font-size: clamp(2rem, 7vw, 4.5rem);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ffd75e, #fff, #ff9e3d, #ffd75e);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255,220,120,0.9));
    line-height: 1.2;
  }

  .sub-title {
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    color: #ffd75e;
    font-weight: 700;
    margin-top: 15px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px rgba(255,215,100,0.8);
  }

  .date-badge {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 25px;
    background: linear-gradient(90deg, #ff9e3d, #ffd75e);
    color: #2b1b4d;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(255,180,60,0.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .tap-hint {
    margin-top: 25px;
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: #fff;
    font-weight: 600;
    opacity: 0.9;
    animation: hintPulse 1.8s ease-in-out infinite;
    text-shadow: 0 0 10px rgba(255,215,100,0.9);
  }
  .tap-hint .hand {
    display: inline-block;
    animation: tapMotion 1.2s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%,100% { opacity: 0.6; }
    50%     { opacity: 1; }
  }
  @keyframes tapMotion {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.3) rotate(-10deg); }
  }

  /* ===== VÒNG SÁNG KHI BẤM ===== */
  .click-ring {
    position: fixed;
    width: 20px;
    height: 20px;
    border: 3px solid #ffd75e;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    transform: translate(-50%, -50%);
    animation: ringExpand 0.8s ease-out forwards;
  }
  @keyframes ringExpand {
    from { width: 20px; height: 20px; opacity: 1; border-width: 4px; }
    to   { width: 200px; height: 200px; opacity: 0; border-width: 1px; }
  }

  /* ===== QR GÓC DƯỚI ===== */
  .qr-corner {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 10;
    text-align: center;
    opacity: 0.9;
    transition: opacity 0.3s, transform 0.3s;
  }
  .qr-corner:hover { opacity: 1; transform: scale(1.05); }
  .qr-corner img {
    border-radius: 10px;
    padding: 6px;
    background: #fff;
    box-shadow: 0 4px 20px rgba(255,215,100,0.6);
  }
  .qr-corner p {
    font-size: 0.7rem;
    color: #ffd75e;
    margin-top: 5px;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255,215,100,0.9);
  }

  @media (max-width: 480px) {
    .moon { width: 80px; height: 80px; top: 5%; right: 8%; }
    .qr-corner img { width: 70px; height: 70px; }
  }
</style>
</head>
<body>

  <!-- Mặt trăng -->
  <div class="moon"></div>

  <!-- Chữ chính giữa -->
  <div class="center-title">
    <div class="main-title">🌕 CHÚC MỪNG TRUNG THU 🌕</div>
    <div class="sub-title">🏮 ĐOÀN VIÊN • ẤM ÁP • YÊU THƯƠNG 🏮</div>
    <div class="date-badge">📅 25/09/2026</div>
    <div class="tap-hint">
      <span class="hand">👆</span> Bấm vào màn hình để nhận lời chúc <span class="hand">👆</span>
    </div>
  </div>

  <!-- QR GÓC DƯỚI PHẢI - LINK THẬT CỦA MÀY -->
  <div class="qr-corner">
    <img 
      src="https://api.qrserver.com/v1/create-qr-code/?data=https://quanglong100512-lang.github.io/trungthu/&size=100x100&bgcolor=ffffff&color=2b1b4d&margin=1" 
      alt="QR Code Trung Thu"
      width="100"
      height="100"
    >
    <p>📱 Quét để mở</p>
  </div>

<script>
  /* ===== 20 LỜI CHÚC ===== */
  const wishes = [
    "🌕 Trung Thu vui vẻ, vạn sự như ý!",
    "🏮 Đoàn viên sum họp, ấm áp yêu thương!",
    "✨ Mọi điều ước đều thành hiện thực!",
    "🌙 Trăng rằm sáng tỏ, lòng người an yên!",
    "🥮 Bánh dẻo bánh nướng, ngọt ngào hạnh phúc!",
    "💛 Chúc bạn một mùa Trung Thu thật đẹp!",
    "⭐ Sum vầy bên gia đình, ngập tràn niềm vui!",
    "🎐 Bình an, may mắn, phát tài phát lộc!",
    "🌸 Xinh đẹp như chị Hằng, dịu dàng như ánh trăng!",
    "🐉 Sự nghiệp rồng bay phượng múa, tiền vào như nước!",
    "🍀 Gặp nhiều may mắn, tránh điều xui xẻo!",
    "💖 Yêu thương đong đầy, hạnh phúc viên mãn!",
    "🌟 Tương lai rực rỡ như đèn lồng đêm rằm!",
    "🎑 Mùa trăng này thật ý nghĩa bên người thân!",
    "🏮 Đêm rằm an lành, giấc mơ thành thật!",
    "🥰 Chúc bạn luôn vui vẻ và mỉm cười thật nhiều!",
    "🌠 Điều ước dưới trăng sẽ sớm thành hiện thực!",
    "🎉 Trung Thu năm nay đong đầy kỷ niệm đẹp!",
    "🌈 Cuộc sống muôn màu, hạnh phúc trọn vẹn!",
    "💫 Mọi chuyện đều suôn sẻ, thuận buồm xuôi gió!"
  ];

  /* ===== 150 NGÔI SAO NHẤP NHÁY ===== */
  for (let i = 0; i < 150; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    document.body.appendChild(star);
  }

  /* ===== CHỮ TỰ ĐỘNG BAY ===== */
  const autoTexts = [
    "🌕 Trung Thu Vui Vẻ 🌕",
    "🏮 Đoàn Viên Sum Họp 🏮",
    "✨ Vạn Sự Như Ý ✨",
    "🌙 Chị Hằng Chúc Phúc 🌙",
    "🥮 Bánh Dẻo Bánh Nướng 🥮",
    "💛 Ấm Áp Yêu Thương 💛",
    "⭐ Sum Vầy Hạnh Phúc ⭐",
    "🎐 Bình An May Mắn 🎐",
    "🏮 Đêm Rằm Sáng Tỏ 🏮",
    "🌟 Trăng Sáng Tình Thân 🌟",
    "🎑 Mùa Trăng Đoàn Viên 🎑",
    "💫 Chúc Mừng Trung Thu 💫"
  ];

  function createFlyingText() {
    const text = document.createElement('div');
    text.className = 'flying-text';
    text.textContent = autoTexts[Math.floor(Math.random() * autoTexts.length)];
    text.style.top = (5 + Math.random() * 88) + '%';
    text.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
    const reverse = Math.random() > 0.5;
    const duration = 9 + Math.random() * 8;
    text.style.animation = `${reverse ? 'flyRightToLeft' : 'flyLeftToRight'} ${duration}s linear forwards`;
    document.body.appendChild(text);
    setTimeout(() => text.remove(), (duration + 1) * 1000);
  }
  setInterval(createFlyingText, 1100);
  for (let i = 0; i < 10; i++) setTimeout(createFlyingText, i * 200);

  /* ===== SAO BĂNG ===== */
  function createShootingStar() {
    const star = document.className = 'shooting-star';
    star.style.left = Math.random() * 60 + 50 + '%';
    star.style.top = Math.random() * 40 + '%';
    star.style.animation = `shoot ${1 + Math.random() * 1}s linear forwards`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 2500);
  }
  setInterval(createShootingStar, 2000);
  for (let i = 0; i < 3; i++) setTimeout(createShootingStar, i * 500);

  /* ===== ĐÈN LỒNG BAY ===== */
  const lanternEmojis = ['🏮', '🎐', '🌟', '✨'];
  for (let i = 0; i < 10; i++) {
    const lantern = document.createElement('div');
    lantern.className = 'lantern';
    lantern.textContent = lanternEmojis[i % lanternEmojis.length];
    lantern.style.left = Math.random() * 100 + '%';
    lantern.style.animationDuration = (8 + Math.random() * 6) + 's';
    lantern.style.animationDelay = Math.random() * 10 + 's';
    lantern.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
    document.body.appendChild(lantern);
  }

  /* ===== BẤM ĐỂ NHẬN LỜI CHÚC ===== */
  function createBurstText(x, y) {
    const wish = wishes[Math.floor(Math.random() * wishes.length)];
    const angle = (Math.random() * Math.PI * 2);
    const distance = 150 + Math.random() * 200;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 100;
    const rot = (Math.random() - 0.5) * 30;

    const el = document.createElement('div');
    el.className = 'burst-text';
    el.textContent = wish;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (0.95 + Math.random() * 0.5) + 'rem';
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dy', dy + 'px');
    el.style.setProperty('--rot', rot + 'deg');
    
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function createClickRing(x, y) {
    const ring = document.createElement('div');
    ring.className = 'click-ring';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 900);
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('.qr-corner')) return;
    const x = e.clientX;
    const y = e.clientY;
    createClickRing(x, y);
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      setTimeout(() => createBurstText(x, y), i * 120);
    }
    burstHearts(x, y);
  });

  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('.qr-corner')) return;
    const touch = e.touches[0];
    const x = touch.clientX;
    const y = touch.clientY;
    createClickRing(x, y);
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      setTimeout(() => createBurstText(x, y), i * 120);
    }
    burstHearts(x, y);
  }, { passive: true });

  /* ===== TIM BAY ===== */
  function burstHearts(x, y) {
    const icons = ['💛', '🏮', '🌟', '🥮', '💖', '✨', '🌙'];
    for (let i = 0; i < 10; i++) {
      const heart = document.createElement('div');
      heart.textContent = icons[Math.floor(Math.random() * icons.length)];
      heart.style.position = 'fixed';
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      heart.style.fontSize = (1 + Math.random() * 0.8) + 'rem';
      heart.style.pointerEvents = 'none';
      heart.style.zIndex = '998';
      
      const angle = (Math.random() * Math.PI * 2);
      const dist = 80 + Math.random() * 150;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 80;
      
      heart.style.transition = 'all 1.5s cubic-bezier(0.2, 0.8, 0.3, 1)';
      heart.style.opacity = '1';
      heart.style.transform = 'translate(-50%, -50%) scale(0.5)';
      
      document.body.appendChild(heart);
      
      requestAnimationFrame(() => {
        heart.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.3) rotate(${(Math.random()-0.5)*360}deg)`;
        heart.style.opacity = '0';
      });
      
      setTimeout(() => heart.remove(), 1600);
    }
  }

  /* ===== TỰ ĐỘNG BẮN LỜI CHÚC BAN ĐẦU ===== */
  window.addEventListener('load', () => {
    setTimeout(() => {
      const x = window.innerWidth / 2;
      const y = window.innerHeight / 2;
      for (let i = 0; i < 4; i++) {
        setTimeout(() => createBurstText(x, y), i * 200);
      }
      burstHearts(x, y);
    }, 800);
  });
</script>
</body>
</html>
